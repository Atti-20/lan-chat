name: iOS Build

on:
  pull_request:
    paths:
      - "VERSION"
      - "apps/ios/**"
      - "frontend/**"
      - "scripts/ci/check-version-consistency.py"
      - "src/main/java/com/lanchat/config/**"
      - "src/main/resources/application.yml"
      - ".github/workflows/ios-build.yml"
  push:
    branches:
      - master
      - "feature/**"
      - "codex/**"
    paths:
      - "VERSION"
      - "apps/ios/**"
      - "frontend/**"
      - "scripts/ci/check-version-consistency.py"
      - "src/main/java/com/lanchat/config/**"
      - "src/main/resources/application.yml"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Capacitor iOS verification
    # macos-14 is deprecated in actions/runner-images, and macos-latest is a
    # floating label while every other runner in this repository is pinned.
    # macos-26 is GA and ships the Xcode 26 / iOS 26 simulator SDK this job was
    # reproduced against locally; macos-15 (Xcode 16.4) is the fallback if the
    # image is retired.
    runs-on: macos-26
    env:
      # apps/ios/ios/.gitignore already excludes DerivedData, so the build
      # products stay inside the platform directory without dirtying the tree.
      IOS_DERIVED_DATA: apps/ios/ios/DerivedData
    steps:
      - uses: actions/checkout@v4

      - name: Check release version consistency
        run: python3 scripts/ci/check-version-consistency.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/ios/package-lock.json

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -F iphonesimulator

      - name: Test native discovery address handling
        run: |
          swiftc apps/ios/ios/App/App/MeshXDiscoveryAddress.swift \
            apps/ios/tests/MeshXDiscoveryAddressTests.swift \
            -o "$RUNNER_TEMP/meshx-discovery-address-tests"
          "$RUNNER_TEMP/meshx-discovery-address-tests"

      - name: Install JavaScript dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix apps/ios

      - name: Build and sync shared Vue assets
        run: npm run sync:ios --prefix apps/ios

      # CapApp-SPM resolves @capacitor/* through apps/ios/node_modules, so
      # this must run after npm ci and cap sync regenerated Package.swift.
      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project apps/ios/ios/App/App.xcodeproj \
            -scheme App \
            -derivedDataPath "$IOS_DERIVED_DATA"

      # CI has no Apple provisioning profile, so signing stays disabled and the
      # only supported destination is the simulator. No device or archive build.
      - name: Build unsigned iOS Simulator app
        run: |
          xcodebuild -project apps/ios/ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$IOS_DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify unsigned simulator app bundle
        shell: bash
        run: |
          set -euo pipefail
          app="$IOS_DERIVED_DATA/Build/Products/Debug-iphonesimulator/App.app"
          plist="$app/Info.plist"
          test -d "$app"
          test -f "$plist"

          # iOS bundles are flat: the executable sits next to Info.plist.
          executable_name="$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist"
          )"
          executable="$app/$executable_name"
          test -x "$executable"
          test "$(
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist"
          )" = "com.atti20.lanchat"

          # Proves the shared Vue bundle really landed in the native container.
          test -s "$app/public/index.html"

          file "$executable" | tee ios-app-smoke.txt
          grep -Fq "Mach-O" ios-app-smoke.txt

          # Simulator products carry only the linker ad-hoc signature. Assert it
          # so a real signing identity can never sneak into this job's output.
          codesign -dv --verbose=4 "$app" 2>&1 | tee ios-app-codesign.txt
          grep -Fq "adhoc" ios-app-codesign.txt
          grep -Fq "linker-signed" ios-app-codesign.txt
          if grep -Fq "Authority=" ios-app-codesign.txt; then
            echo "::error::Simulator artifact carries a signing authority chain."
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent \
            "$app" ios-unsigned-simulator-app.zip

      # Same honesty convention as the mDNS boundary notice in e2e.yml: state
      # what this pipeline does NOT prove instead of implying device coverage.
      - name: Record iOS signing coverage boundary
        if: always()
        run: |
          echo "::notice title=iOS signing not verified::CI builds an unsigned iOS Simulator app only; device install, code signing, notarization and TestFlight are not exercised."
          echo "### iOS CI coverage boundary" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified: unsigned \`iphonesimulator\` build of scheme \`App\` with \`CODE_SIGNING_ALLOWED=NO\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Not verified: signed device build, provisioning profiles, real-device install, TestFlight or App Store submission. Those require an Apple Developer account that this repository does not hold, and no placeholder credentials are generated." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lanchat-ios-${{ github.sha }}
          path: |
            ios-unsigned-simulator-app.zip
            ios-app-smoke.txt
            ios-app-codesign.txt
          if-no-files-found: error
          retention-days: 14
