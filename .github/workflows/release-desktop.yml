name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag matching the repository VERSION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verified-candidates:
    name: ${{ matrix.name }} signed candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            name: Linux
            os: ubuntu-22.04
            bundles: appimage,deb
            targetArgs: ""
            bundleRoot: apps/desktop/src-tauri/target/release/bundle
          - id: macos
            name: macOS universal
            os: macos-14
            bundles: app,dmg
            targetArgs: --target universal-apple-darwin
            bundleRoot: apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          - id: windows
            name: Windows
            os: windows-2022
            bundles: nsis,msi
            targetArgs: ""
            bundleRoot: apps/desktop/src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      TAURI_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve and validate release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          scripts/release/verify-release-tag.sh "$REQUESTED_TAG"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Require updater signing material
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || {
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for release artifacts."
            exit 1
          }
          test -n "$TAURI_UPDATER_PUBLIC_KEY" || {
            echo "::error::TAURI_UPDATER_PUBLIC_KEY is required; no placeholder key is generated."
            exit 1
          }

      - name: Require macOS signing and notarization material
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if ! {
            test -n "$APPLE_CERTIFICATE" \
              && test -n "$APPLE_CERTIFICATE_PASSWORD" \
              && test -n "$APPLE_SIGNING_IDENTITY" \
              && test -n "$APPLE_TEAM_ID" \
              && test -n "$APPLE_ID" \
              && test -n "$APPLE_PASSWORD"
          }; then
            echo "::error::Apple Developer certificate, identity, team, and notarization secrets are required."
            exit 1
          fi

      - name: Require Windows code-signing material
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! {
            test -n "$WINDOWS_CERTIFICATE_BASE64" \
              && test -n "$WINDOWS_CERTIFICATE_PASSWORD" \
              && test -n "$TAURI_WINDOWS_CERTIFICATE_THUMBPRINT"
          }; then
            echo "::error::Windows PFX, password, and certificate thumbprint secrets are required."
            exit 1
          fi

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.id == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install JavaScript dependencies
        shell: bash
        run: |
          npm ci --prefix frontend
          npm ci --prefix apps/desktop

      - name: Import Apple Developer certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "meshx-code-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          $password = ConvertTo-SecureString `
            -String $env:WINDOWS_CERTIFICATE_PASSWORD `
            -AsPlainText `
            -Force
          Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password | Out-Null

      - name: Generate protected updater config overlay
        shell: bash
        env:
          TAURI_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node scripts/release/write-tauri-updater-overlay.mjs \
            apps/desktop/src-tauri/tauri.release.generated.json

      - name: Run locked Rust tests before release
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build signed release candidate without publishing
        id: build
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: apps/desktop
          args: ${{ matrix.targetArgs }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.generated.json -- --locked

      - name: Verify Linux release candidate
        if: runner.os == 'Linux'
        shell: bash
        run: |
          scripts/release/verify-linux-release.sh \
            "${{ matrix.bundleRoot }}" \
            "${{ steps.release.outputs.version }}"

      - name: Verify signed, notarized universal macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          scripts/release/notarize-macos-dmg.sh \
            "${{ matrix.bundleRoot }}"
          scripts/release/verify-macos-release.sh \
            "${{ matrix.bundleRoot }}" \
            "${{ steps.release.outputs.version }}"

      - name: Verify Windows Authenticode release candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/release/verify-windows-release.ps1 `
            -BundleRoot "${{ matrix.bundleRoot }}" `
            -ExpectedVersion "${{ steps.release.outputs.version }}"

      - name: Stage verified release artifacts
        shell: bash
        run: |
          node scripts/release/stage-desktop-artifacts.mjs \
            "${{ matrix.id }}" \
            "${{ matrix.bundleRoot }}" \
            "release-candidates/${{ matrix.id }}" \
            "${{ steps.release.outputs.version }}"

      - name: Upload verified candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-candidate-${{ matrix.id }}
          path: |
            release-candidates/${{ matrix.id }}/
            release-verification/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 14

  publish-draft:
    name: Publish draft after every verification gate
    needs: verified-candidates
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          scripts/release/verify-release-tag.sh "$REQUESTED_TAG"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${REQUESTED_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download verified candidates
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-release-candidate-*
          path: verified-candidates

      - name: Verify updater signatures against the configured public key
        run: |
          test -n "$TAURI_UPDATER_PUBLIC_KEY" || {
            echo "::error::TAURI_UPDATER_PUBLIC_KEY is required to verify release artifacts."
            exit 1
          }
          sudo apt-get update
          sudo apt-get install -y minisign
          scripts/release/verify-updater-signatures.sh verified-candidates

      - name: Assemble updater manifest and checksums
        run: |
          node scripts/release/assemble-desktop-release.mjs \
            verified-candidates \
            release-assets \
            "${{ steps.release.outputs.version }}" \
            "${{ steps.release.outputs.tag }}" \
            "${{ github.repository }}"

      - name: Preserve assembled release evidence
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-verified-${{ steps.release.outputs.tag }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

      - name: Create or update verified draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: MeshX ${{ steps.release.outputs.tag }}
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Desktop candidates were attached only after all platform gates passed.

            macOS evidence includes universal arm64/x86_64 architecture, Developer ID and Team ID,
            strict code-sign verification, Gatekeeper assessment, notarization ticket validation,
            DMG verification, and validation of the mounted app copy.

            This automated evidence does not replace physical-device installation, first-launch,
            or old-version updater regression. Keep this release as a draft until those checks
            and the server/Android release evidence are attached.
          files: release-assets/*
